<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flash! - Pro Edition</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #F0F2F5;
            --card: #FFFFFF;
            --primary: #FFD600; 
            --secondary: #A084CF;
            --text-main: #1A1A1B;
            --radius: 32px;
            --border: 4px solid #000;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden; /* Prevent body scroll, handle scroll in containers */
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
            overflow-y: auto;
        }

        .hidden { opacity: 0; pointer-events: none; transform: scale(0.95); z-index: -1; }

        /* Unified Header */
        .header-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px 0;
            z-index: 100;
        }

        h1 { font-size: 2.5rem; margin: 0; font-weight: 900; letter-spacing: -1.5px; }

        #setup-screen { justify-content: flex-start; padding-bottom: 120px; }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 1.5rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 0 #000;
            border: var(--border);
        }

        /* Language Toggle */
        .lang-switch { display: flex; gap: 6px; }
        .btn-mini {
            border: 2px solid #000; background: #fff;
            padding: 8px 12px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-mini.active { background: #000; color: #fff; }
        .btn-mini:active { transform: translateY(2px); }

        /* Controls */
        .control-group { margin-top: 20px; }
        .slider-container { margin: 15px 0; }
        .slider-meta { display: flex; justify-content: space-between; font-weight: 800; font-size: 0.9rem; margin-bottom: 8px;}
        input[type=range] { width: 100%; appearance: none; background: #ddd; height: 14px; border-radius: 10px; border: 2px solid #000; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 28px; height: 28px; background: var(--primary); border: 3px solid #000; border-radius: 50%; cursor: pointer; }

        .color-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; margin: 10px 0; }
        .color-box { aspect-ratio: 1; border-radius: 6px; border: 2px solid transparent; cursor: pointer; transition: transform 0.1s; }
        .color-box:active { transform: scale(0.9); }
        .color-box.selected { border-color: #000; transform: scale(1.1); box-shadow: 0 3px 0 #000; z-index: 2;}

        .timer-presets { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .chip { padding: 10px 16px; border: 2px solid #000; border-radius: 16px; font-weight: bold; background: #fff; cursor: pointer; transition: all 0.2s; }
        .chip.active { background: var(--primary); box-shadow: 0 4px 0 #000; transform: translateY(-2px); }
        .chip:active { transform: translateY(2px); box-shadow: none; }

        /* Fixed Action Buttons */
        .btn-big {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 460px;
            padding: 18px; border-radius: 20px; border: 4px solid #000;
            font-size: 1.4rem; font-weight: 900; background: var(--primary); 
            box-shadow: 0 8px 0 #000; z-index: 200; cursor: pointer; transition: all 0.1s;
        }
        .btn-big:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 4px 0 #000; }

        /* End Screen Components */
        #end-screen { 
            background: rgba(26, 26, 27, 0.95); /* Darker, less transparent background */
            color: white; 
            justify-content: center; 
            backdrop-filter: blur(8px); 
            z-index: 300; 
        }
        .end-container { text-align: center; display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; }
        .done-text { font-size: 4.5rem; font-weight: 900; text-shadow: 4px 4px 0 var(--secondary); margin-bottom: 20px; animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .secondary-btn {
            background: transparent; color: white; padding: 16px; border-radius: 18px; 
            border: 4px solid white; font-weight: 800; font-size: 1.1rem; width: 100%;
            cursor: pointer; transition: all 0.1s;
        }
        .secondary-btn:active { transform: translateY(4px); background: rgba(255,255,255,0.1); }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Play Screen */
        #play-screen { justify-content: center; z-index: 50; transition: background-color 0.3s linear; }
        .timer-wrapper { position: relative; display: flex; align-items: center; justify-content: center; margin: auto; }
        .timer-svg { transform: rotate(-90deg); }
        .timer-progress { fill: none; stroke: var(--secondary); stroke-width: 8; stroke-linecap: round; }
        .timer-text { position: absolute; font-weight: 800; color: #fff; text-shadow: 2px 2px 0 #000; font-family: monospace; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: #fff; border: 3px solid #000; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; z-index: 110; cursor: pointer; color: black; }
        .back-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <!-- Setup Screen -->
    <div id="setup-screen" class="screen">
        <div class="header-bar">
            <h1 id="t-title">Flash!</h1>
            <div class="lang-switch">
                <button class="btn-mini active" onclick="setLang('en')">EN</button>
                <button class="btn-mini" onclick="setLang('zh')">繁中</button>
            </div>
        </div>

        <div class="card">
            <div class="slider-container">
                <div class="slider-meta"><span id="t-speed-label">Flash Speed</span><span id="speed-display">1.0x</span></div>
                <input type="range" id="speed-slider" min="0" max="200" value="100">
                <div class="slider-meta" style="margin-top: 5px; font-size: 0.75rem; opacity: 0.6;">
                    <span>0.1x</span>
                    <span>Standard</span>
                    <span>8.0x</span>
                </div>
            </div>

            <div class="control-group">
                <div style="font-weight: 800; margin-bottom: 8px;" id="t-timer-label">Game Duration</div>
                <div class="timer-presets">
                    <button class="chip active" data-sec="15">15s</button>
                    <button class="chip" data-sec="30">30s</button>
                    <button class="chip" data-sec="60">60s</button>
                    <button class="chip" data-sec="custom" id="t-custom">Custom</button>
                </div>
                <div id="custom-inputs" style="display:none; margin-top:10px; gap: 10px; align-items: center;">
                    <input type="number" id="min-in" style="width:70px; padding:10px; border:2px solid #000; border-radius:12px; font-weight: bold; text-align: center;" placeholder="Min">
                    <input type="number" id="sec-in" style="width:70px; padding:10px; border:2px solid #000; border-radius:12px; font-weight: bold; text-align: center;" placeholder="Sec">
                </div>
            </div>

            <div class="control-group">
                <div style="font-weight: 800; margin: 15px 0 8px;" id="t-color-label">Palette</div>
                <div id="color-grid" class="color-grid"></div>
            </div>
        </div>

        <button id="play-btn" class="btn-big">PLAY</button>
    </div>

    <!-- Play Screen -->
    <div id="play-screen" class="screen hidden">
        <button class="back-btn" onclick="stopGame()"><i data-lucide="x"></i></button>
        
        <div class="timer-wrapper">
            <svg class="timer-svg" width="240" height="240">
                <circle cx="120" cy="120" r="100" style="fill:rgba(255,255,255,0.15); stroke:rgba(0,0,0,0.2); stroke-width:8;"></circle>
                <circle id="color-progress" class="timer-progress" cx="120" cy="120" r="100" stroke-dasharray="628" stroke-dashoffset="0"></circle>
            </svg>
            <div id="color-timer-text" class="timer-text" style="font-size: 3.5rem;">0.0</div>
        </div>
        
        <div style="position: absolute; bottom: 50px; text-align: center; width: 100%;">
            <div id="t-total-remain" style="color:#fff; font-weight:900; font-size:0.85rem; text-transform: uppercase; letter-spacing: 1px; text-shadow:1px 1px 0 #000; margin-bottom: 5px;">Total Remaining</div>
            <div id="total-timer-text" style="color:#fff; font-size:1.8rem; font-weight:900; text-shadow:2px 2px 0 #000;">00:00</div>
        </div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="screen hidden">
        <div class="end-container">
            <div class="done-text" id="t-done">Done!</div>
            <!-- Start Again button uses fixed position logic relative to its container -->
            <button class="btn-big" style="position:static; width:100%; transform:none; max-width: 100%;" id="t-again" onclick="restartGame()">Start Again</button>
            <button class="secondary-btn" id="t-back" onclick="goToSettings()">Back to Settings</button>
        </div>
    </div>

    <script>
        const i18n = {
            en: { title: "Flash!", speed: "Flash Speed", timer: "Game Duration", custom: "Custom", color: "Palette", play: "PLAY", total: "Total Remaining", done: "Done!", again: "Start Again", back: "Back to Settings" },
            zh: { title: "閃爍!", speed: "閃爍速度", timer: "遊戲時長", custom: "自訂", color: "選擇色板", play: "開始", total: "剩餘總時間", done: "完成！", again: "再玩一次", back: "返回設置" }
        };

        let currentLang = 'en';
        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.btn-mini').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(lang === 'en' ? 'en' : '繁中')));
            document.getElementById('t-title').innerText = i18n[lang].title;
            document.getElementById('t-speed-label').innerText = i18n[lang].speed;
            document.getElementById('t-timer-label').innerText = i18n[lang].timer;
            document.getElementById('t-custom').innerText = i18n[lang].custom;
            document.getElementById('t-color-label').innerText = i18n[lang].color;
            document.getElementById('play-btn').innerText = i18n[lang].play;
            document.getElementById('t-total-remain').innerText = i18n[lang].total;
            document.getElementById('t-done').innerText = i18n[lang].done;
            document.getElementById('t-again').innerText = i18n[lang].again;
            document.getElementById('t-back').innerText = i18n[lang].back;
        }

        // Speed Logic
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        let speedMultiplier = 1.0;

        speedSlider.oninput = () => {
            const val = parseInt(speedSlider.value);
            if (val <= 100) { speedMultiplier = (0.1 + (val / 100) * 0.9).toFixed(2); } 
            else { speedMultiplier = (1.0 + ((val - 100) / 100) * 7.0).toFixed(1); }
            speedDisplay.innerText = speedMultiplier + 'x';
        };

        // Color Grid
        const colorGrid = document.getElementById('color-grid');
        let selectedColors = [];
        const hues = [0, 30, 50, 100, 160, 190, 230, 280, 320, 0];
        for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 9; c++) {
                const color = `hsl(${hues[r]}, ${r === 9 ? 0 : 75}%, ${15 + c * 8}%)`;
                const div = document.createElement('div');
                div.className = 'color-box';
                div.style.backgroundColor = color;
                if (c === 4) { div.classList.add('selected'); selectedColors.push(color); }
                div.onclick = () => {
                    div.classList.toggle('selected');
                    selectedColors = Array.from(document.querySelectorAll('.color-box.selected')).map(b => b.style.backgroundColor);
                };
                colorGrid.appendChild(div);
            }
        }

        // Timer Handling
        let totalDuration = 15;
        document.querySelectorAll('.chip').forEach(chip => {
            chip.onclick = () => {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                totalDuration = chip.dataset.sec;
                document.getElementById('custom-inputs').style.display = totalDuration === 'custom' ? 'flex' : 'none';
            };
        });

        // Game Logic State
        let gameActive = false;
        let animationFrameId;
        let startTime, colorStartTime, currentColorIdx = 0;
        let totalMs = 0;
        let intervalMs = 4000;

        function startGame() {
            if (selectedColors.length === 0) return alert(currentLang === 'en' ? "Please select at least one color!" : "請至少選擇一種顏色！");
            
            if (totalDuration === 'custom') {
                const m = parseInt(document.getElementById('min-in').value) || 0;
                const s = parseInt(document.getElementById('sec-in').value) || 0;
                totalMs = (m * 60 + s) * 1000;
            } else {
                totalMs = parseInt(totalDuration) * 1000;
            }
            if (totalMs <= 0) return alert(currentLang === 'en' ? "Invalid time!" : "時間無效！");

            intervalMs = 4000 / parseFloat(speedMultiplier);
            gameActive = true;
            startTime = Date.now();
            colorStartTime = Date.now();
            currentColorIdx = 0;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('play-screen').classList.remove('hidden');
            
            // Set initial color immediately
            document.getElementById('play-screen').style.backgroundColor = selectedColors[0];
            
            runFrame();
        }

        function runFrame() {
            if (!gameActive) return;

            const now = Date.now();
            const totalElapsed = now - startTime;
            const colorElapsed = now - colorStartTime;

            // 1. Check if game is over
            if (totalElapsed >= totalMs) {
                endGame();
                return;
            }

            // 2. Update Total Timer Text
            const totalRemaining = Math.max(0, totalMs - totalElapsed);
            const trSec = Math.ceil(totalRemaining / 1000);
            document.getElementById('total-timer-text').innerText = 
                `${String(Math.floor(trSec/60)).padStart(2,'0')}:${String(trSec%60).padStart(2,'0')}`;

            // 3. Update Color Flashes
            if (colorElapsed >= intervalMs) {
                colorStartTime = now;
                currentColorIdx = (currentColorIdx + 1) % selectedColors.length;
                document.getElementById('play-screen').style.backgroundColor = selectedColors[currentColorIdx];
            }
            
            // 4. Update Color Progress Circle (628 is the circumference for r=100)
            const colorRemaining = Math.max(0, intervalMs - colorElapsed);
            const colorPercent = (colorRemaining / intervalMs) * 628;
            document.getElementById('color-progress').style.strokeDashoffset = 628 - colorPercent;
            document.getElementById('color-timer-text').innerText = (colorRemaining / 1000).toFixed(1);

            animationFrameId = requestAnimationFrame(runFrame);
        }

        function stopGame() {
            gameActive = false;
            cancelAnimationFrame(animationFrameId);
            document.getElementById('play-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }

        function endGame() {
            gameActive = false;
            cancelAnimationFrame(animationFrameId);
            
            // Zero out timers visually
            document.getElementById('total-timer-text').innerText = "00:00";
            document.getElementById('color-timer-text').innerText = "0.0";
            document.getElementById('color-progress').style.strokeDashoffset = 628;

            // Show End Screen overlay
            document.getElementById('end-screen').classList.remove('hidden');
        }

        function restartGame() {
            document.getElementById('end-screen').classList.add('hidden');
            startGame();
        }

        function goToSettings() {
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('play-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }

        document.getElementById('play-btn').onclick = startGame;
        lucide.createIcons();
    </script>
</body>
</html>
